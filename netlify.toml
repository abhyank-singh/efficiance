# Netlify config. The frontend builds to dist/ (static); /api/* is served by a
# single Netlify Function that wraps the Express app via serverless-http.
#
# One-time setup before deploying to Netlify:
#   npm install serverless-http
# (kept out of package.json so `npm ci` on Docker/Render/Vercel stays lockfile-clean.)

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# API -> function. :splat is the part after /api/, e.g. ai/insights.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback for client-side routes (everything except /api and real files).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
